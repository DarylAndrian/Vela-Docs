<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Preferences Dialog - Appearance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#141b2b",
                        "secondary-container": "#8792fe",
                        "on-secondary-container": "#17228f",
                        "surface-container": "#e9edff",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#edf0ff",
                        "surface-dim": "#d3daef",
                        "secondary": "#4953bc",
                        "on-surface-variant": "#464555",
                        "on-secondary-fixed": "#000767",
                        "on-primary-fixed": "#0f0069",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f1f3ff",
                        "primary-fixed": "#e2dfff",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "outline": "#777587",
                        "on-primary-container": "#dad7ff",
                        "on-secondary-fixed-variant": "#2f3aa3",
                        "secondary-fixed": "#e0e0ff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary-container": "#ffd2be",
                        "surface-tint": "#4d44e3",
                        "surface-variant": "#dce2f7",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed": "#351000",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e1e8fd",
                        "background": "#f9f9ff",
                        "primary-fixed-dim": "#c3c0ff",
                        "inverse-primary": "#c3c0ff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#dce2f7",
                        "on-surface": "#141b2b",
                        "primary": "#3525cd",
                        "secondary-fixed-dim": "#bdc2ff",
                        "tertiary-fixed-dim": "#ffb695",
                        "inverse-surface": "#293040",
                        "tertiary": "#7e3000",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#a44100",
                        "primary-container": "#4f46e5",
                        "outline-variant": "#c7c4d8",
                        "tertiary-fixed": "#ffdbcc",
                        "error": "#ba1a1a",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"

                    "spacing": {
                        "2xl": "32px",
                        "page-margin": "min(10%, 96px)",
                        "lg": "16px",
                        "base": "4px",
                        "xs": "4px",
                        "sm": "8px",
                        "gutter": "16px",
                        "xl": "24px",
                        "md": "12px",
                        "4xl": "64px",
                        "3xl": "48px"
                    },
                    "fontFamily": {
                        "display-editor": ["\"Source Serif 4\""],
                        "body-ui": ["Inter"],
                        "mono": ["JetBrains Mono"],
                        "label-md": ["Inter"],
                        "h2-ui": ["Inter"],
                        "body-editor": ["\"Source Serif 4\""],
                        "h1-ui": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "display-editor": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-ui": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "mono": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "h2-ui": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-editor": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h1-ui": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom scrollbar for dark dialog */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #464555;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #777587;
        }
    </style>
</head>
<body class="bg-surface font-body-ui text-body-ui text-on-surface h-screen w-screen flex items-center justify-center p-lg overflow-hidden antialiased">
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-on-background/30 backdrop-blur-sm z-40"></div>
<!-- Preferences Dialog Container (Dark Mode explicitly set via dark colors) -->
<div class="relative z-50 w-full max-w-[840px] h-[600px] bg-inverse-surface rounded-xl shadow-2xl flex flex-row overflow-hidden border border-outline-variant/20 text-inverse-on-surface">
<!-- Sidebar Navigation -->
<div class="w-[240px] border-r border-outline-variant/10 bg-inverse-surface flex flex-col shrink-0">
<!-- Sidebar Header -->
<div class="px-lg pt-xl pb-md flex items-center gap-sm text-surface-bright">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-h2-ui text-h2-ui">Preferences</span>
</div>
<!-- Navigation Links -->
<nav class="flex-1 overflow-y-auto px-sm py-sm flex flex-col gap-xs font-label-md text-label-md">
<button class="flex items-center gap-md px-md py-sm rounded-lg text-outline-variant hover:bg-surface-variant/10 hover:text-surface-bright transition-colors text-left w-full group">
<span class="material-symbols-outlined text-[20px] group-hover:text-surface-bright">tune</span>
                    General
                </button>
<button class="flex items-center gap-md px-md py-sm rounded-lg text-outline-variant hover:bg-surface-variant/10 hover:text-surface-bright transition-colors text-left w-full group">
<span class="material-symbols-outlined text-[20px] group-hover:text-surface-bright">edit_document</span>
                    Editor
                </button>
<!-- Active Item -->
<button class="flex items-center gap-md px-md py-sm rounded-lg bg-surface-variant/20 text-primary-fixed-dim font-bold border-l-2 border-primary-fixed-dim transition-all text-left w-full shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">palette</span>
                    Appearance
                </button>
<button class="flex items-center gap-md px-md py-sm rounded-lg text-outline-variant hover:bg-surface-variant/10 hover:text-surface-bright transition-colors text-left w-full group">
<span class="material-symbols-outlined text-[20px] group-hover:text-surface-bright">spellcheck</span>
                    Spell check
                </button>
<button class="flex items-center gap-md px-md py-sm rounded-lg text-outline-variant hover:bg-surface-variant/10 hover:text-surface-bright transition-colors text-left w-full group">
<span class="material-symbols-outlined text-[20px] group-hover:text-surface-bright">memory</span>
                    Advanced
                </button>
</nav>
<!-- Bottom Navigation / Info -->
<div class="p-sm mt-auto border-t border-outline-variant/10">
<button class="flex items-center gap-md px-md py-sm rounded-lg text-outline-variant hover:bg-surface-variant/10 hover:text-surface-bright transition-colors text-left w-full font-label-md text-label-md group">
<span class="material-symbols-outlined text-[20px] group-hover:text-surface-bright">info</span>
                    About
                </button>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col bg-[#222836] relative"> <!-- Slightly darker shade of inverse-surface for depth -->
<!-- Content Header -->
<header class="px-xl py-lg flex items-center justify-between border-b border-outline-variant/10 shrink-0">
<div>
<h1 class="font-h1-ui text-h1-ui text-surface-bright">Appearance</h1>
<p class="font-body-ui text-body-ui text-outline-variant mt-xs">Customize the look and feel of your workspace.</p>
</div>
<!-- Close Button -->
<button class="p-sm rounded-full hover:bg-surface-variant/10 text-outline-variant hover:text-surface-bright transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto p-xl flex flex-col gap-3xl">
<!-- Theme Selection Section -->
<section class="flex flex-col gap-lg">
<div class="flex items-center gap-sm border-b border-outline-variant/10 pb-sm">
<span class="material-symbols-outlined text-outline-variant">contrast</span>
<h2 class="font-h2-ui text-h2-ui text-surface-bright">Theme</h2>
</div>
<div class="grid grid-cols-3 gap-lg">
<!-- Light Theme Card -->
<button class="group flex flex-col items-center gap-md p-md rounded-lg border border-outline-variant/20 hover:border-outline-variant/40 bg-inverse-surface transition-all text-left">
<div class="w-full h-24 rounded-md bg-surface-bright border border-outline-variant/30 flex items-center justify-center overflow-hidden shadow-inner relative">
<!-- Mock Light UI -->
<div class="absolute inset-0 bg-surface flex flex-col">
<div class="h-4 bg-surface-container-low border-b border-outline-variant/30 w-full flex items-center px-1"><div class="w-12 h-1 bg-outline-variant/30 rounded-full"></div></div>
<div class="flex-1 p-2"><div class="w-full h-2 bg-outline-variant/20 rounded-full mb-1"></div><div class="w-3/4 h-2 bg-outline-variant/20 rounded-full"></div></div>
</div>
</div>
<div class="flex items-center justify-between w-full font-label-md text-label-md text-outline-variant group-hover:text-surface-bright">
<span>Light</span>
<div class="w-4 h-4 rounded-full border border-outline-variant/50"></div>
</div>
</button>
<!-- Dark Theme Card (Active) -->
<button class="group flex flex-col items-center gap-md p-md rounded-lg border-2 border-primary-fixed-dim bg-inverse-surface transition-all text-left shadow-[0_0_15px_rgba(195,192,255,0.1)]">
<div class="w-full h-24 rounded-md bg-inverse-surface border border-outline-variant/30 flex items-center justify-center overflow-hidden shadow-inner relative">
<!-- Mock Dark UI -->
<div class="absolute inset-0 bg-inverse-surface flex flex-col">
<div class="h-4 bg-[#1e2330] border-b border-outline-variant/10 w-full flex items-center px-1"><div class="w-12 h-1 bg-outline-variant/20 rounded-full"></div></div>
<div class="flex-1 p-2"><div class="w-full h-2 bg-outline-variant/10 rounded-full mb-1"></div><div class="w-3/4 h-2 bg-outline-variant/10 rounded-full"></div></div>
</div>
</div>
<div class="flex items-center justify-between w-full font-label-md text-label-md text-primary-fixed-dim font-bold">
<span>Dark</span>
<div class="w-4 h-4 rounded-full border-4 border-primary-fixed-dim bg-inverse-surface flex items-center justify-center">
<div class="w-1.5 h-1.5 bg-primary-fixed-dim rounded-full"></div>
</div>
</div>
</button>
<!-- System Theme Card -->
<button class="group flex flex-col items-center gap-md p-md rounded-lg border border-outline-variant/20 hover:border-outline-variant/40 bg-inverse-surface transition-all text-left">
<div class="w-full h-24 rounded-md border border-outline-variant/30 flex items-center justify-center overflow-hidden shadow-inner relative">
<!-- Mock System UI (Split) -->
<div class="absolute inset-0 flex">
<div class="w-1/2 h-full bg-surface"></div>
<div class="w-1/2 h-full bg-inverse-surface"></div>
</div>
</div>
<div class="flex items-center justify-between w-full font-label-md text-label-md text-outline-variant group-hover:text-surface-bright">
<span>System</span>
<div class="w-4 h-4 rounded-full border border-outline-variant/50"></div>
</div>
</button>
</div>
</section>
<!-- Font Scaling Section -->
<section class="flex flex-col gap-lg">
<div class="flex items-center gap-sm border-b border-outline-variant/10 pb-sm">
<span class="material-symbols-outlined text-outline-variant">text_format</span>
<h2 class="font-h2-ui text-h2-ui text-surface-bright">Font Scaling</h2>
</div>
<div class="bg-inverse-surface border border-outline-variant/10 rounded-lg p-lg flex flex-col gap-lg">
<div class="flex items-center justify-between font-body-ui text-body-ui text-outline-variant">
<span>Adjust interface text size</span>
<span class="text-surface-bright font-mono">100%</span>
</div>
<div class="flex items-center gap-md w-full">
<span class="font-label-md text-label-md text-outline-variant">A</span>
<div class="relative flex-1 h-2 bg-surface-variant/10 rounded-full flex items-center">
<!-- Track Fill -->
<div class="absolute left-0 h-full w-1/2 bg-primary-fixed-dim rounded-l-full"></div>
<!-- Thumb -->
<div class="absolute left-1/2 -translate-x-1/2 w-4 h-4 bg-primary-fixed-dim rounded-full shadow-md cursor-pointer border-2 border-inverse-surface hover:scale-110 transition-transform"></div>
<!-- Markers -->
<div class="absolute inset-0 flex justify-between px-1 pointer-events-none">
<div class="w-0.5 h-full bg-inverse-surface/50"></div>
<div class="w-0.5 h-full bg-inverse-surface/50"></div>
<div class="w-0.5 h-full bg-inverse-surface/50"></div>
<div class="w-0.5 h-full bg-inverse-surface/50"></div>
<div class="w-0.5 h-full bg-inverse-surface/50"></div>
</div>
</div>
<span class="font-h2-ui text-h2-ui text-surface-bright">A</span>
</div>
</div>
</section>
<!-- Additional Display Settings -->
<section class="flex flex-col gap-lg pb-xl">
<div class="bg-inverse-surface border border-outline-variant/10 rounded-lg divide-y divide-outline-variant/10">
<label class="flex items-center justify-between p-md hover:bg-surface-variant/5 transition-colors cursor-pointer group rounded-t-lg">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-surface-bright">Show Layout Bounds</span>
<span class="font-label-sm text-label-sm text-outline-variant mt-xs">Display faint outlines around structural elements</span>
</div>
<div class="relative w-10 h-5 bg-surface-variant/20 rounded-full group-hover:bg-surface-variant/30 transition-colors">
<div class="absolute left-1 top-1 w-3 h-3 bg-outline-variant rounded-full transition-transform"></div>
</div>
</label>
<label class="flex items-center justify-between p-md hover:bg-surface-variant/5 transition-colors cursor-pointer group rounded-b-lg">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-surface-bright">Reduce Motion</span>
<span class="font-label-sm text-label-sm text-outline-variant mt-xs">Disable interface animations for a simplified experience</span>
</div>
<div class="relative w-10 h-5 bg-primary-fixed-dim rounded-full transition-colors">
<div class="absolute left-1 top-1 w-3 h-3 bg-inverse-surface rounded-full translate-x-5 transition-transform"></div>
</div>
</label>
</div>
</section>
</div>
</div>
</div>
</body></html>
