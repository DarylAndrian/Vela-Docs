<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Page Setup - Vela Docs</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;family=Source+Serif+4:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#141b2b",
                        "secondary-container": "#8792fe",
                        "on-secondary-container": "#17228f",
                        "surface-container": "#e9edff",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#edf0ff",
                        "surface-dim": "#d3daef",
                        "secondary": "#4953bc",
                        "on-surface-variant": "#464555",
                        "on-secondary-fixed": "#000767",
                        "on-primary-fixed": "#0f0069",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f1f3ff",
                        "primary-fixed": "#e2dfff",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "outline": "#777587",
                        "on-primary-container": "#dad7ff",
                        "on-secondary-fixed-variant": "#2f3aa3",
                        "secondary-fixed": "#e0e0ff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary-container": "#ffd2be",
                        "surface-tint": "#4d44e3",
                        "surface-variant": "#dce2f7",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed": "#351000",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e1e8fd",
                        "background": "#f9f9ff",
                        "primary-fixed-dim": "#c3c0ff",
                        "inverse-primary": "#c3c0ff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#dce2f7",
                        "on-surface": "#141b2b",
                        "primary": "#3525cd",
                        "secondary-fixed-dim": "#bdc2ff",
                        "tertiary-fixed-dim": "#ffb695",
                        "inverse-surface": "#293040",
                        "tertiary": "#7e3000",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#a44100",
                        "primary-container": "#4f46e5",
                        "outline-variant": "#c7c4d8",
                        "tertiary-fixed": "#ffdbcc",
                        "error": "#ba1a1a",
                        "surface": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "2xl": "32px",
                        "page-margin": "min(10%, 96px)",
                        "lg": "16px",
                        "base": "4px",
                        "xs": "4px",
                        "sm": "8px",
                        "gutter": "16px",
                        "xl": "24px",
                        "md": "12px",
                        "4xl": "64px",
                        "3xl": "48px"
                    },
                    "fontFamily": {
                        "display-editor": ["\"Source Serif 4\""],
                        "body-ui": ["Inter"],
                        "mono": ["JetBrains Mono"],
                        "label-md": ["Inter"],
                        "h2-ui": ["Inter"],
                        "body-editor": ["\"Source Serif 4\""],
                        "h1-ui": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "display-editor": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-ui": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "mono": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "h2-ui": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-editor": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h1-ui": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .modal-shadow { box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
        .card-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0; }
        .material-symbols-outlined.fill-1 { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-ui antialiased flex flex-col items-center justify-center relative">
<!-- Dimmed Background Overlay -->
<div class="absolute inset-0 bg-on-background/20 z-10"></div>
<!-- Page Setup Dialog (Level 3 Elevation) -->
<dialog class="relative z-20 bg-surface rounded-xl modal-shadow p-0 m-auto w-full max-w-3xl overflow-hidden border border-outline-variant" open="">
<!-- Header -->
<div class="px-xl py-lg border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
<h2 class="font-h2-ui text-h2-ui text-on-surface m-0">Page Setup</h2>
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-variant p-base rounded-DEFAULT transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Body -->
<div class="p-xl flex gap-2xl">
<!-- Left Column: Settings -->
<div class="flex-1 flex flex-col gap-xl">
<!-- Paper Size -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Paper size</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline rounded-DEFAULT px-md py-sm font-body-ui text-body-ui text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
<option>Letter (8.5" x 11")</option>
<option>A4 (210 x 297 mm)</option>
<option>Legal (8.5" x 14")</option>
<option>Tabloid (11" x 17")</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant text-lg">arrow_drop_down</span>
</div>
</div>
<!-- Orientation -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Orientation</label>
<div class="grid grid-cols-2 gap-md">
<label class="cursor-pointer border-2 border-primary bg-surface-container-high rounded-lg p-md flex flex-col items-center gap-sm transition-colors">
<input checked="" class="sr-only" name="orientation" type="radio"/>
<span class="material-symbols-outlined fill-1 text-primary">description</span>
<span class="font-label-md text-label-md text-primary">Portrait</span>
</label>
<label class="cursor-pointer border border-outline hover:border-outline-variant hover:bg-surface-container-low rounded-lg p-md flex flex-col items-center gap-sm transition-colors text-on-surface-variant">
<input class="sr-only" name="orientation" type="radio"/>
<span class="material-symbols-outlined" style="transform: rotate(-90deg);">description</span>
<span class="font-label-md text-label-md">Landscape</span>
</label>
</div>
</div>
<!-- Margins -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Margins (inches)</label>
<div class="grid grid-cols-2 gap-md">
<div class="flex items-center gap-sm">
<label class="font-body-ui text-body-ui text-on-surface w-16">Top</label>
<input class="w-24 bg-surface border border-outline rounded-DEFAULT px-md py-sm font-mono text-mono text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" step="0.1" type="number" value="1.0"/>
</div>
<div class="flex items-center gap-sm">
<label class="font-body-ui text-body-ui text-on-surface w-16">Bottom</label>
<input class="w-24 bg-surface border border-outline rounded-DEFAULT px-md py-sm font-mono text-mono text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" step="0.1" type="number" value="1.0"/>
</div>
<div class="flex items-center gap-sm">
<label class="font-body-ui text-body-ui text-on-surface w-16">Left</label>
<input class="w-24 bg-surface border border-outline rounded-DEFAULT px-md py-sm font-mono text-mono text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" step="0.1" type="number" value="1.0"/>
</div>
<div class="flex items-center gap-sm">
<label class="font-body-ui text-body-ui text-on-surface w-16">Right</label>
<input class="w-24 bg-surface border border-outline rounded-DEFAULT px-md py-sm font-mono text-mono text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" step="0.1" type="number" value="1.0"/>
</div>
</div>
</div>
</div>
<!-- Right Column: Live Preview -->
<div class="w-64 bg-surface-container-low rounded-lg p-lg flex flex-col gap-sm items-center justify-center border border-outline-variant">
<label class="font-label-sm text-label-sm text-on-surface-variant self-start">Preview</label>
<!-- Simulated Page -->
<div class="bg-surface card-shadow border border-outline-variant w-[170px] h-[220px] rounded-sm relative flex flex-col">
<!-- Simulated Margins -->
<div class="absolute top-[20px] bottom-[20px] left-[20px] right-[20px] border border-dashed border-primary-fixed-dim/50 pointer-events-none"></div>
<!-- Simulated Content Lines -->
<div class="mt-[24px] mx-[24px] space-y-2 opacity-30">
<div class="h-1 bg-on-surface rounded-full w-3/4"></div>
<div class="h-1 bg-on-surface rounded-full w-full"></div>
<div class="h-1 bg-on-surface rounded-full w-5/6"></div>
<div class="h-1 bg-on-surface rounded-full w-full"></div>
<div class="h-1 bg-on-surface rounded-full w-4/5"></div>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-xl py-lg border-t border-outline-variant flex justify-end gap-md bg-surface-container-lowest">
<button class="px-lg py-sm font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-variant rounded-DEFAULT transition-colors">
                Cancel
            </button>
<button class="px-lg py-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-on-primary-fixed-variant rounded-DEFAULT transition-colors shadow-sm">
                OK
            </button>
</div>
</dialog>
</body></html>
