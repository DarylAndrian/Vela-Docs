<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background dark:bg-[#121212] min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 flex items-center justify-center">
<!-- Modal Container -->
<div class="bg-inverse-surface rounded-xl shadow-modal w-full max-w-4xl border border-outline/20 flex flex-col max-h-[921px]">
<!-- Header & Location -->
<div class="px-xl py-lg border-b border-outline/20 flex flex-col gap-md">
<div class="flex items-center justify-between">
<h2 class="font-h1-ui text-h1-ui text-on-tertiary">Export Document</h2>
<button class="text-surface-variant hover:text-on-tertiary transition-colors">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</div>
<!-- Breadcrumb Location -->
<div class="flex items-center gap-sm bg-[#1e2330] p-sm rounded-lg border border-outline/10">
<span class="material-symbols-outlined text-surface-variant icon-fill">folder</span>
<span class="font-body-ui text-body-ui text-surface-variant">My Documents</span>
<span class="material-symbols-outlined text-surface-variant text-sm">chevron_right</span>
<span class="font-body-ui text-body-ui text-surface-variant">Project Alpha</span>
<span class="material-symbols-outlined text-surface-variant text-sm">chevron_right</span>
<span class="font-body-ui text-body-ui text-on-tertiary">Final Drafts</span>
</div>
<!-- Filename Input -->
<div class="mt-sm relative">
<input class="w-full bg-[#1e2330] border border-outline/20 rounded-lg px-md py-sm font-body-ui text-body-ui text-on-tertiary focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed/50 transition-all" type="text" value="Q4_Strategy_Report_Final"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-md">
<span class="font-mono text-mono text-surface-variant" id="file-extension">.pdf</span>
</div>
</div>
</div>
<!-- Format Grid -->
<div class="p-xl overflow-y-auto">
<h3 class="font-label-md text-label-md text-surface-variant uppercase tracking-wider mb-lg">Select Format</h3>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-md">
<!-- Word (.docx) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".docx"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-[#2b579a]/20 p-sm rounded-lg text-[#5c9ce6]">
<span class="material-symbols-outlined icon-fill">description</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.docx</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Word Document</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- PDF (.pdf) -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="format" type="radio" value=".pdf"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-[#e3242b]/20 p-sm rounded-lg text-[#ff6b6b]">
<span class="material-symbols-outlined icon-fill">picture_as_pdf</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.pdf</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Portable Document Format</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- ODT (.odt) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".odt"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-secondary-fixed/20 p-sm rounded-lg text-secondary-fixed">
<span class="material-symbols-outlined icon-fill">article</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.odt</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">OpenDocument Text</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- Rich Text (.rtf) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".rtf"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-surface-variant/20 p-sm rounded-lg text-surface-variant">
<span class="material-symbols-outlined icon-fill">text_snippet</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.rtf</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Rich Text Format</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- HTML (.html) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".html"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-[#e34f26]/20 p-sm rounded-lg text-[#ff7a55]">
<span class="material-symbols-outlined icon-fill">html</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.html</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Web Page</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- Markdown (.md) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".md"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-surface-variant/20 p-sm rounded-lg text-surface-variant">
<span class="material-symbols-outlined icon-fill">markdown</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.md</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Markdown</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- Plain Text (.txt) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".txt"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-surface-variant/20 p-sm rounded-lg text-surface-variant">
<span class="material-symbols-outlined icon-fill">notes</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.txt</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Plain Text</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
<!-- Legacy Word (.doc) -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value=".doc"/>
<div class="bg-[#1e2330] border border-outline/10 rounded-lg p-lg h-full transition-all group-hover:bg-[#252a3a] peer-checked:border-primary-fixed peer-checked:bg-primary/10 peer-checked:ring-1 peer-checked:ring-primary-fixed">
<div class="flex items-start gap-md mb-sm">
<div class="bg-[#2b579a]/20 p-sm rounded-lg text-[#5c9ce6] opacity-70">
<span class="material-symbols-outlined icon-fill">description</span>
</div>
<div>
<h4 class="font-h2-ui text-h2-ui text-on-tertiary text-[16px] leading-tight">.doc</h4>
</div>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-sm">Legacy Word</p>
<div class="absolute top-md right-md opacity-0 peer-checked:opacity-100 text-primary-fixed">
<span class="material-symbols-outlined icon-fill">check_circle</span>
</div>
</div>
</label>
</div>
</div>
<!-- Footer Actions -->
<div class="px-xl py-lg border-t border-outline/20 bg-[#1e2330] rounded-b-xl flex justify-end gap-md">
<button class="px-lg py-sm font-label-md text-label-md text-surface-variant hover:bg-surface-variant/10 rounded-lg transition-colors border border-transparent">
                    Cancel
                </button>
<button class="px-lg py-sm font-label-md text-label-md bg-primary text-on-primary rounded-lg hover:bg-primary-container transition-colors shadow-sm flex items-center gap-sm">
<span class="material-symbols-outlined text-sm">export_notes</span>
                    Export
                </button>
</div>
</div>
</div>
<script>
        const formatInputs = document.querySelectorAll('input[name="format"]');
        const extensionDisplay = document.getElementById('file-extension');

        formatInputs.forEach(input => {
            input.addEventListener('change', (e) => {
                extensionDisplay.textContent = e.target.value;
            });
        });
    </script>
</body></html>
