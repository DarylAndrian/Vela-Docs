# .github/workflows/windows.yml — v0.3.4 (PROD-01)
name: windows-build

on:
  push:        { branches: [main, release/**] }
  pull_request:
  schedule:    [ { cron: '17 0 * * *' } ]   # daily @ 00:17 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host:    windows
          target:  desktop
          arch:    win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel'

      - name: Configure (CMake)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DVE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

      - uses: nsis-dev/setup-nsis@v1

      - name: Installer
        run: makensis installer/vela-docs.nsi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: vela-docs-windows
          path: installer/VelaDocs-Setup-*.exe
          if-no-files-found: error
